spring.application.name=controle-papel-test
server.servlet.context-path=/controle_chapa

spring.datasource.url=jdbc:h2:mem:controle_chapa_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# As migracoes Flyway usam SQL especifico do PostgreSQL (ON CONFLICT),
# incompativel com o H2 dos testes. Aqui o schema e gerado pelo Hibernate.
spring.flyway.enabled=false

spring.thymeleaf.cache=false
