spring.application.name=controle-chapa
server.port=${SERVER_PORT:6001}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/controle_chapa}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/controle_chapa}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/paper-migration
spring.flyway.validate-on-migrate=true

spring.thymeleaf.cache=false
server.error.include-message=always
server.servlet.session.timeout=24h

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
