<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login · Controle de Chapa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        }
        .login-logo {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: #2563eb;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .form-control {
            min-height: 48px;
            border-radius: 12px;
        }
        .btn-primary {
            min-height: 48px;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-logo">CC</div>
    <h1 class="h3 fw-bold mb-1">Controle de Chapa</h1>
    <p class="text-muted mb-4">Acesse com seu usu&aacute;rio e senha.</p>

    <div th:if="${param.error}" class="alert alert-danger py-2 small">Usu&aacute;rio ou senha inv&aacute;lidos.</div>
    <div th:if="${param.logout}" class="alert alert-info py-2 small">Voc&ecirc; saiu do sistema.</div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label class="form-label small fw-semibold">Usu&aacute;rio</label>
            <input class="form-control" type="text" name="username" required autofocus autocomplete="off">
        </div>
        <div class="mb-4">
            <label class="form-label small fw-semibold">Senha</label>
            <input class="form-control" type="password" name="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Entrar</button>
        <div class="text-muted small mt-3">Usu&aacute;rio padr&atilde;o inicial: <strong>admin</strong></div>
    </form>
</div>
</body>
</html>
