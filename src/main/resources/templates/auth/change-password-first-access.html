<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Trocar senha no primeiro acesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #ecfeff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px 12px;
        }
        .change-card {
            width: 100%;
            max-width: 440px;
            padding: 40px 36px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 24px 48px rgba(15, 23, 42, 0.09);
        }
        .change-icon {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 28px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.22);
        }
        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        .form-control {
            min-height: 48px;
            border-radius: 12px;
            border-color: #cbd5e1;
            padding: 10px 14px;
            font-size: 15px;
        }
        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
        }
        .btn-primary {
            min-height: 50px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
            border: none;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 24px rgba(37, 99, 235, 0.30);
            background: linear-gradient(135deg, #4f46e5 0%, #1d4ed8 100%);
        }
        .alert {
            border-radius: 12px;
            border: none;
        }
        .logout-link {
            color: #64748b;
            font-size: 14px;
            text-decoration: none;
            transition: color 0.15s ease;
        }
        .logout-link:hover {
            color: #334155;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="change-card">
    <div class="change-icon">🔐</div>
    <h1 class="h3 fw-bold mb-1" style="color: #0f172a;">Altera&ccedil;&atilde;o de senha obrigat&oacute;ria</h1>
    <p class="text-muted mb-4" style="line-height: 1.6;">
        Ol&aacute;, <strong th:text="${userName}">Nome do usu&aacute;rio</strong>.<br>
        Para sua seguran&ccedil;a, crie uma nova senha antes de continuar usando o sistema.
    </p>

    <div class="alert alert-danger" th:if="${mustChange eq false}">
        Este acesso j&aacute; foi validado. Nenhuma altera&ccedil;&atilde;o de senha &eacute; necess&aacute;ria.
        <div class="mt-3">
            <a class="btn btn-outline-primary w-100" th:href="@{/relatorios/dashboard}" style="min-height: 46px; border-radius: 12px;">Ir para o dashboard</a>
        </div>
    </div>

    <div class="alert alert-success py-2 small mb-3" th:if="${success != null}" th:text="${success}"></div>
    <div class="alert alert-danger py-2 small mb-3" th:if="${error != null}" th:text="${error}"></div>

    <form th:action="@{/trocar-senha-primeiro-acesso}" th:object="${passwordForm}" method="post" th:if="${mustChange eq true}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="mb-3">
            <label class="form-label" for="newPassword">Nova senha</label>
            <input class="form-control" id="newPassword" type="password" th:field="*{newPassword}" placeholder="M&iacute;nimo 4 caracteres" autofocus>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
        </div>

        <div class="mb-4">
            <label class="form-label" for="confirmPassword">Confirmar nova senha</label>
            <input class="form-control" id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Digite a mesma senha novamente">
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>

        <button class="btn btn-primary w-100" type="submit">Salvar nova senha e continuar</button>

        <div class="mt-4 pt-3 text-center" style="border-top: 1px solid #f1f5f9;">
            <form th:action="@{/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="logout-link" type="submit" style="background: none; border: none; cursor: pointer; padding: 0;">
                    ← Sair do sistema e voltar para login
                </button>
            </form>
        </div>
    </form>
</div>
</body>
</html>
