<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/layout :: layout('Usuarios', 'admin-users', ~{::section})">
<section>
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1">Usu&aacute;rios</h1>
            <div class="text-muted">Cadastro de usu&aacute;rios liberado apenas para administrador.</div>
        </div>
    </div>

    <div class="alert alert-success" th:if="${success != null}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>

    <div class="row g-3">
        <div class="col-12 col-lg-5">
            <div class="card">
                <div class="card-header fw-semibold">Novo usu&aacute;rio</div>
                <div class="card-body">
                    <form th:action="@{/admin/usuarios}" th:object="${userForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input class="form-control" type="text" th:field="*{name}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input class="form-control" type="text" th:field="*{username}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input class="form-control" type="password" th:field="*{password}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Perfil</label>
                            <select class="form-select" th:field="*{role}">
                                <option th:each="role : ${roleOptions}" th:value="${role}" th:text="${role.label}"></option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                        </div>
                        <div class="mb-3 form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{mustChangePassword}" id="mustChangePassword">
                            <label class="form-check-label" for="mustChangePassword">Trocar senha no primeiro acesso</label>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Cadastrar usu&aacute;rio</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-7">
            <div class="card">
                <div class="card-header fw-semibold">Usu&aacute;rios cadastrados</div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Username</th>
                            <th>Perfil</th>
                            <th>Status</th>
                            <th>Senha</th>
                            <th class="text-end">A&ccedil;&otilde;es</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.name}">Administrador</td>
                            <td th:text="${user.username}">admin</td>
                            <td th:text="${user.role.label}">Administrador</td>
                            <td>
                                <span class="badge" th:classappend="${user.enabled ? 'bg-success' : 'bg-secondary'}"
                                      th:text="${user.enabled ? 'Ativo' : 'Inativo'}">Ativo</span>
                            </td>
                            <td>
                                <span class="badge bg-warning text-dark" th:if="${user.mustChangePassword}">Trocar no primeiro acesso</span>
                                <span class="badge bg-success" th:unless="${user.mustChangePassword}">Atualizada</span>
                            </td>
                            <td class="text-end">
                                <form th:action="@{|/admin/usuarios/${user.id}/excluir|}" method="post" onsubmit="return confirm('Deseja excluir este usuario?');">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="6" class="text-center text-muted py-4">Nenhum usu&aacute;rio cadastrado.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
</html>
